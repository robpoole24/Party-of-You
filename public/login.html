<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Party of You</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy-d: #021434; --red: #c8102e; --red-d: #a00c24;
  --sky: #2b7fc1; --white: #f8fafc; --border: rgba(255,255,255,0.1);
  --muted: rgba(255,255,255,0.45);
  --cond: 'Barlow Condensed', sans-serif; --body: 'Barlow', sans-serif;
}
body {
  font-family: var(--body); background: var(--navy-d); color: var(--white);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.box {
  width: 100%; max-width: 420px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px;
}
.logo { width: 200px; margin: 0 auto 28px; display: block; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); text-align: center; margin-bottom: 8px; }
h1 { font-family: var(--cond); font-size: 28px; font-weight: 900; text-transform: uppercase; text-align: center; color: var(--white); margin-bottom: 28px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
input { width: 100%; height: 44px; padding: 0 14px; background: rgba(255,255,255,0.07); border: 1px solid var(--border); border-radius: 7px; color: var(--white); font-size: 15px; font-family: var(--body); outline: none; transition: border-color 0.15s; }
input:focus { border-color: var(--sky); }
input::placeholder { color: rgba(255,255,255,0.25); }
.btn { width: 100%; height: 46px; background: var(--red); color: white; border: none; border-radius: 7px; font-family: var(--cond); font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
.btn:hover { background: var(--red-d); }
.error { background: rgba(200,16,46,0.12); border: 1px solid rgba(200,16,46,0.3); border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #ff8fa3; margin-bottom: 16px; display: none; }
.error.show { display: block; }
.footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
.footer-links a { color: var(--sky); text-decoration: none; }
.footer-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
  <img src="/images/partyofyoulogo.png" alt="Party of You" class="logo">
  <div class="eyebrow">Candidate Portal</div>
  <h1>Sign In</h1>
  <div class="error" id="error"></div>
  <div class="error" id="resetSuccess" style="background:rgba(21,128,61,0.12);border-color:rgba(21,128,61,0.3);color:#86efac">✓ Password updated. You can now sign in with your new password.</div>
  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
    <div style="text-align:right;margin-top:7px">
      <a href="#" id="forgotLink" onclick="goForgot(event)" style="font-size:12px;color:rgba(255,255,255,0.4);text-decoration:none">Forgot password?</a>
    </div>
  </div>
  <button class="btn" onclick="login()">Sign In →</button>
  <div class="footer-links">
    <p>Don't have an account? <a href="/apply.html">Run for Office →</a></p>
    <p style="margin-top:8px"><a href="/">← Back to Home</a></p>
  </div>
</div>
<script>
// Show success banner if redirected from password reset
const _urlParams = new URLSearchParams(window.location.search);
if (_urlParams.get('message') === 'password-reset') {
  document.getElementById('resetSuccess').classList.add('show');
}

// Pre-fill email if carried from forgot-password page
const _prefillEmail = _urlParams.get('email');
if (_prefillEmail) {
  document.getElementById('email').value = _prefillEmail;
}

// Carry current email value into forgot-password page
function goForgot(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  window.location.href = '/forgot-password.html' + (email ? '?email=' + encodeURIComponent(email) : '');
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('error');
  err.classList.remove('show');

  if (!email || !password) {
    err.textContent = 'Email and password required.';
    err.classList.add('show');
    return;
  }

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (data.success) {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/dashboard/';
      window.location.href = data.redirect || redirect;
    } else {
      err.textContent = data.error || 'Login failed. Please check your credentials.';
      err.classList.add('show');
    }
  } catch (e) {
    err.textContent = 'Network error. Please try again.';
    err.classList.add('show');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// Check if already logged in
fetch('/api/auth/me', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(d => { if (d.authenticated) window.location.href = '/dashboard/'; })
  .catch(() => {});
</script>
</body>
</html>
