<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · Party of You</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1b35;
      color: #e8edf5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a2744;
      border: 1px solid #2a3a5c;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo img {
      height: 44px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #8899bb;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aabbd4;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      background: #0f1d35;
      border: 1px solid #2a3a5c;
      border-radius: 7px;
      padding: 11px 14px;
      font-size: 15px;
      color: #e8edf5;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #2563eb;
    }

    .hint {
      font-size: 12px;
      color: #6677aa;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .alert {
      border-radius: 7px;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .alert.error { background: #3b1a1a; border: 1px solid #7f2020; color: #ffaaaa; }
    .alert.success { background: #0f2d1a; border: 1px solid #1a6b35; color: #6effa3; }
    .alert.show { display: block; }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6677aa;
    }

    .back-link a {
      color: #4a9fd4;
      text-decoration: none;
    }

    .back-link a:hover { text-decoration: underline; }

    /* Invalid token state */
    .invalid-state { display: none; text-align: center; }
    .invalid-state.show { display: block; }
    .form-state.hidden { display: none; }

    .invalid-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .invalid-state p {
      color: #8899bb;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="/images/PartyofYouLogo.png" alt="Party of You" />
  </div>

  <!-- Invalid/missing token state -->
  <div class="invalid-state" id="invalidState">
    <div class="invalid-icon">🔗</div>
    <h1>Link Invalid or Expired</h1>
    <p>This password reset link is no longer valid. Reset links expire after 1 hour and can only be used once.</p>
    <a href="/forgot-password.html" class="btn" style="display:inline-block;text-decoration:none;text-align:center">
      Request a New Link
    </a>
    <div class="back-link" style="margin-top:16px">
      <a href="/login.html">← Back to Login</a>
    </div>
  </div>

  <!-- Reset form -->
  <div class="form-state" id="formState">
    <h1>Set New Password</h1>
    <p class="subtitle">Choose a strong password for your Party of You account.</p>

    <div class="alert error" id="errorMsg"></div>
    <div class="alert success" id="successMsg"></div>

    <div id="formFields">
      <label for="password">New Password</label>
      <input type="password" id="password" placeholder="At least 10 characters" autocomplete="new-password" />
      <div class="hint">Minimum 10 characters.</div>

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat your new password" autocomplete="new-password" />

      <button class="btn" id="submitBtn" onclick="submitReset()">Set New Password</button>
    </div>

    <div class="back-link">
      <a href="/login.html">← Back to Login</a>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  // No token in URL — show invalid state immediately
  if (!token || token.length < 32) {
    document.getElementById('invalidState').classList.add('show');
    document.getElementById('formState').classList.add('hidden');
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
    el.classList.remove('error'); // reset
    el.classList.add('error');
    document.getElementById('successMsg').classList.remove('show');
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('formFields').style.display = 'none';
  }

  async function submitReset() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('submitBtn');

    // Client-side validation
    if (password.length < 10) {
      return showError('Password must be at least 10 characters.');
    }
    if (password !== confirm) {
      return showError('Passwords do not match.');
    }

    btn.disabled = true;
    btn.textContent = 'Setting password…';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        // Handle expired/invalid token specifically
        if (data.error?.includes('expired') || data.error?.includes('invalid')) {
          document.getElementById('formState').classList.add('hidden');
          document.getElementById('invalidState').classList.add('show');
          return;
        }
        return showError(data.error || 'Something went wrong. Please try again.');
      }

      showSuccess('Password updated! Redirecting to login…');
      setTimeout(() => { window.location.href = '/login.html?message=password-reset'; }, 2000);
    } catch (err) {
      showError('Network error. Please check your connection and try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitReset();
  });
</script>

</body>
</html>
